<!doctype html>
<html lang="kaa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d3228">
  <title>EcoMap · Bin4Home</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{color-scheme:light;--ink:#12382e;--muted:#71827a;--green:#176b4a;--lime:#bce86e;--paper:#f3f2e9;--card:#fffefa;--line:#e4e8db;--orange:#e99955;--shadow:0 18px 50px #15362b12}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 94% 0,#d6edbb 0,transparent 32%),var(--paper);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    button{font:inherit;color:inherit;cursor:pointer}.shell{max-width:1040px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(100px + env(safe-area-inset-bottom))}
    .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{display:flex;gap:11px;align-items:center;font-weight:800;letter-spacing:-.03em}.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:15px;background:var(--green);color:var(--lime);font-size:22px;box-shadow:0 6px 18px #176b4a33}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.17em;text-transform:uppercase}.lang{border:1px solid var(--line);background:#ffffffc7;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700}
    .hero{position:relative;overflow:hidden;border-radius:28px;padding:25px 25px 24px;background:linear-gradient(120deg,#103a2e,#176648 68%,#257952);color:#fff;box-shadow:var(--shadow);animation:rise .55s ease both}.hero:after{content:"";position:absolute;width:210px;height:210px;border:1px solid #ffffff25;border-radius:50%;right:-45px;top:-105px;box-shadow:0 0 0 28px #ffffff0c,0 0 0 56px #ffffff08}.hero-tag{display:inline-flex;align-items:center;gap:7px;color:#d7f1ba;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.pulse{width:7px;height:7px;background:var(--lime);border-radius:50%;box-shadow:0 0 0 5px #bce86e25}.hero h1{font-size:clamp(26px,6vw,44px);line-height:1.04;letter-spacing:-.05em;max-width:560px;margin:16px 0 10px}.hero p{color:#d5e4d8;max-width:470px;margin:0}.hero-bottom{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-top:25px}.hero-user{font-size:13px;color:#d9e8dd}.hero-action{border:0;background:var(--lime);color:#173829;border-radius:14px;padding:11px 15px;font-weight:800;white-space:nowrap;box-shadow:0 5px 14px #08291c38;transition:transform .18s}.hero-action:active{transform:scale(.96)}
    .grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:13px;margin-top:14px}.card{background:var(--card);border:1px solid #e8eadd;border-radius:22px;padding:17px;box-shadow:var(--shadow);animation:rise .55s ease both}.metric{grid-column:span 3;min-height:130px}.wide{grid-column:span 7}.narrow{grid-column:span 5}.full{grid-column:1/-1}.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-weight:650;font-size:12px}.icon{display:grid;place-items:center;width:31px;height:31px;border-radius:11px;background:#eaf3df;font-size:16px}.metric strong{display:block;font-size:clamp(26px,5vw,36px);letter-spacing:-.06em;margin-top:17px}.metric small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.section-title{font-size:18px;font-weight:800;letter-spacing:-.03em;margin:0 0 12px}.hint{color:var(--muted);font-size:12px;margin:-6px 0 14px}.chart{height:125px;width:100%;display:flex;align-items:end;gap:8px;padding:10px 2px 0}.bar-col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:6px}.bar{width:min(28px,70%);min-height:4px;background:linear-gradient(180deg,#bce86e,#48a267);border-radius:8px 8px 4px 4px;transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}.bar-label{font-size:9px;color:var(--muted)}.empty-chart{color:var(--muted);font-size:12px;text-align:center;width:100%;align-self:center}
    .mix{display:flex;align-items:center;gap:18px}.donut{width:118px;height:118px;flex:0 0 118px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#176b4a 0deg,#bce86e 0deg,#e99955 0deg,#e8ede0 0deg);position:relative}.donut:after{content:"";position:absolute;inset:12px;background:var(--card);border-radius:50%}.donut-center{position:relative;z-index:1;text-align:center;font-size:15px;font-weight:800}.donut-center small{display:block;font-size:9px;color:var(--muted);font-weight:600}.legend{display:grid;gap:9px;font-size:12px}.legend-row{display:flex;gap:7px;align-items:center}.dot{width:8px;height:8px;border-radius:50%}.empty{color:var(--muted);font-size:12px;padding:16px 0}.pill{padding:5px 9px;background:#edf4e7;border-radius:999px;font-size:10px;font-weight:700;color:var(--green)}.report-list{display:grid;gap:8px}.report-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.report-row:last-child{border:0}.toast{position:fixed;left:18px;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));padding:13px 15px;background:#183b30;color:white;border-radius:16px;box-shadow:var(--shadow);display:none;z-index:9;font-size:13px}.toast.show{display:block;animation:rise .2s ease}.loading{min-height:240px;display:grid;place-items:center;color:var(--muted)}.spinner{width:26px;height:26px;border:3px solid #d9e5d2;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}.hidden{display:none!important}.fade{animation:rise .4s ease both}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes grow{from{transform:scaleY(.1)}to{transform:scaleY(1)}}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:680px){.shell{padding-left:13px;padding-right:13px}.hero{padding:21px;border-radius:24px}.metric{grid-column:span 6;min-height:118px}.wide,.narrow{grid-column:span 12}.card{border-radius:19px;padding:15px}.hero-bottom{align-items:start;flex-direction:column}.hero-action{width:100%}.mix{justify-content:flex-start}.top{margin-bottom:13px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><span class="brand-mark">✳</span><span>EcoMap<small>Bin4Home · pilot</small></span></div><button class="lang" id="language" aria-label="Change language">ҚҚ · RU</button></header>
    <div id="loading" class="loading"><span class="spinner"></span></div>
    <div id="app" class="hidden">
      <section class="hero"><div class="hero-tag"><i class="pulse"></i><span id="eyebrow"></span></div><h1 id="headline"></h1><p id="subhead"></p><div class="hero-bottom"><div id="welcome" class="hero-user"></div><button id="openBot" class="hero-action"></button></div></section>
      <section id="resident" class="grid">
        <article class="card metric"><div class="card-head"><span id="binsLabel"></span><i class="icon">♻️</i></div><strong id="binsValue">0</strong><small id="binsHint"></small></article>
        <article class="card metric"><div class="card-head"><span id="fullLabel"></span><i class="icon">🟠</i></div><strong id="fullValue">0</strong><small id="fullHint"></small></article>
        <article class="card metric"><div class="card-head"><span id="impactLabel"></span><i class="icon">🌱</i></div><strong id="impactValue">0</strong><small id="impactHint"></small></article>
        <article class="card metric"><div class="card-head"><span id="calendarLabel"></span><i class="icon">🚚</i></div><strong style="font-size:19px" id="calendarValue">—</strong><small id="calendarHint"></small></article>
        <article class="card full"><h2 class="section-title" id="residentBinsTitle"></h2><div id="residentBins" class="report-list"></div></article>
        <article class="card full"><h2 class="section-title" id="reportsTitle"></h2><p class="hint" id="reportsHint"></p><div id="reports" class="report-list"></div></article>
        <article class="card full"><h2 class="section-title" id="sortTitle"></h2><div id="sorting" class="report-list"></div></article>
      </section>
      <section id="admin" class="grid hidden">
        <article class="card metric"><div class="card-head"><span id="residentsLabel"></span><i class="icon">🏠</i></div><strong id="residentsValue">0</strong><small id="residentsHint"></small></article>
        <article class="card metric"><div class="card-head"><span id="adminBinsLabel"></span><i class="icon">♻️</i></div><strong id="adminBinsValue">0</strong><small id="adminBinsHint"></small></article>
        <article class="card metric"><div class="card-head"><span id="adminCasesLabel"></span><i class="icon">📍</i></div><strong id="adminCasesValue">0</strong><small id="adminCasesHint"></small></article>
        <article class="card metric"><div class="card-head"><span id="adminWeightLabel"></span><i class="icon">⚖️</i></div><strong id="adminWeightValue">0</strong><small id="adminWeightHint"></small></article>
        <article class="card wide"><h2 class="section-title" id="dailyTitle"></h2><p class="hint" id="dailyHint"></p><div id="dailyChart" class="chart"></div></article>
        <article class="card narrow"><h2 class="section-title" id="materialsTitle"></h2><p class="hint" id="materialsHint"></p><div class="mix"><div class="donut" id="donut"><div class="donut-center"><span id="acceptedTotal">0</span><small>kg</small></div></div><div class="legend" id="legend"></div></div></article>
        <article class="card full"><h2 class="section-title" id="operationsTitle"></h2><div id="operations" class="report-list"></div><p class="hint" id="updatedAt"></p></article>
      </section>
    </div>
  </main>
  <div class="toast" id="toast"></div>
  <script>
    (()=>{
      const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
      const copy={
        kaa:{eyebrow:'QALA TAZALÍǴÍ · BIRGE',headline:'Taza qala, bir úyden baslanadı.',subhead:'Bólek jıynawdı ápiwayı etemiz. Hár bir kilogram — tábiyatqa qaytqan úles.',hello:'Xosh keldińiz',open:'Telegram-da botdı ashıw',bins:'Sizdiń konteynerlerińiz',binsHint:'Bólekler boyınsha',full:'Alıp ketiw kerek',fullHint:'Tolǵan konteynerler',impact:'Qayta islewge qabıl etildi',impactHint:'Tastıyıqlanǵan salmaq',calendar:'Aldınǵı alıp ketiw',calendarHint:'Jadval, waqıt belgilengen',notRegistered:'Dáslep Telegram-botta úydi dizimnen ótkeriń.',openBot:'Konteynerdi dizimge alıw',reports:'Meniń múrájatlarım',reportsHint:'Qaldırılǵan alıp ketiw yamasa qoqıs haqqında xabar',noReports:'Házir múrájat joq. Bot arqalı «Alıp ketpedi» yaki qoqıs haqqında xabar beriń.',sort:'Qanday sortlaw kerek?',plastic:'Plastik',paper:'Qaǵaz',glass:'Shiyshe',plasticTip:'Bos, taza qaptama. Azıq qaldıǵın shayıp taslań.',paperTip:'Qurǵaq qaǵaz hám karton. Maylı qaǵazdı qospang.',glassTip:'Bankalar hám shórekeler. Keramika men lampalar emes.',residentBins:'Meniń konteynerlerim',emptyBin:'Bos',fullBin:'Alıp ketiw kerek',dump:'Qoqıs haqqında xabar',pickup:'Alıp ketiw múrájatı',newStatus:'Jańa',resolvedStatus:'Sheshildi',admin:'Ákimshilik paneli',residents:'Úyler dizimge alınǵan',residentsHint:'qayta islewge qosılǵan úyler',adminBins:'Konteynerler',adminBinsHint:'tolǵanı {n}',adminCases:'Ashıq múrájatlar',adminCasesHint:'qoqıs {a} · alıp ketiw {b}',adminWeight:'Jıynalǵan salmaq',adminWeightHint:'qabıl etildi {n} kg',daily:'Aptalıq jıynaw',dailyHint:'Sońǵı 7 kún · kg',materials:'Qabıl etilgen material',materialsHint:'qayta islew orayı tastıyıqladı',operations:'Operaciyalıq jaǵday',openDumps:'Ashıq qoqıs xabarları',openIssues:'Ashıq alıp ketiw múrájatları',batches:'Jıynaw reysleri',allReports:'Barlıq qoqıs xabarları',schedule:'Alıp ketiw kestesi',timezone:'Waqıt aymaǵı',updated:'Jańalandı',noData:'Ázir maǵlıwmat joq',notAdmin:'Bul bet tek administrator ushın.',networkError:'Maǵlıwmat júklenbedi. Bot ishinen qayta ashıń.',langSaved:'Til saqlandı.'},
        ru:{eyebrow:'ЧИСТЫЙ ГОРОД · НАЧИНАЕМ ВМЕСТЕ',headline:'Чистый город начинается с одного дома.',subhead:'Раздельный сбор без лишней сложности. Каждый килограмм — вклад в возвращение ресурсов.',hello:'Добро пожаловать',open:'Открыть бота в Telegram',bins:'Ваши контейнеры',binsHint:'По отдельным фракциям',full:'Нужен вывоз',fullHint:'Заполненные контейнеры',impact:'Принято на переработку',impactHint:'Подтверждённый вес',calendar:'Следующий вывоз',calendarHint:'По настроенному расписанию',notRegistered:'Сначала зарегистрируйте дом в Telegram-боте.',openBot:'Подключить дом',reports:'Мои обращения',reportsHint:'Пропущенный вывоз или сообщение о свалке',noReports:'Обращений пока нет. Сообщите о пропущенном вывозе или свалке через бота.',sort:'Как сортировать?',plastic:'Пластик',paper:'Бумага',glass:'Стекло',plasticTip:'Пустая чистая упаковка. Сполосните остатки еды.',paperTip:'Сухая бумага и картон. Без жирных загрязнений.',glassTip:'Банки и бутылки. Не керамика и не лампы.',residentBins:'Мои контейнеры',emptyBin:'Пустой',fullBin:'Нужен вывоз',dump:'Сообщение о свалке',pickup:'Пропущенный вывоз',newStatus:'Новая',resolvedStatus:'Решено',admin:'Панель администратора',residents:'Домохозяйства',residentsHint:'подключено к сбору',adminBins:'Контейнеры',adminBinsHint:'полных: {n}',adminCases:'Открытые обращения',adminCasesHint:'свалки: {a} · вывоз: {b}',adminWeight:'Собрано',adminWeightHint:'принято {n} кг',daily:'Сбор за неделю',dailyHint:'Последние 7 дней · кг',materials:'Принято по материалам',materialsHint:'подтверждено переработчиком',operations:'Операционная сводка',openDumps:'Открытые сообщения о свалках',openIssues:'Заявки о пропущенном вывозе',batches:'Рейсы сборщиков',allReports:'Всего сообщений о свалках',schedule:'График вывоза',timezone:'Часовой пояс',updated:'Обновлено',noData:'Пока нет данных',notAdmin:'Эта страница доступна только администратору.',networkError:'Не удалось загрузить данные. Откройте приложение из бота.',langSaved:'Язык сохранён.'}
      };
      let lang=localStorage.getItem('ecomap-lang')||'kaa'; let summary=null; let stats=null;
      const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const fmt=(s,vars={})=>Object.keys(vars).reduce((out,k)=>out.replaceAll('{'+k+'}',vars[k]),s);
      async function api(path,method='GET',body){if(!tg?.initData)throw new Error('outside_telegram');const res=await fetch(path,{method,headers:{'X-Telegram-Init-Data':tg.initData,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!res.ok)throw new Error(res.status===403?'forbidden':'request_failed');return res.json()}
      function setText(id,text){$(id).textContent=text}
      function drawShell(){const t=copy[lang];document.documentElement.lang=lang==='kaa'?'kaa':'ru';setText('eyebrow',t.eyebrow);setText('headline',t.headline);setText('subhead',t.subhead);setText('openBot',t.open);setText('binsLabel',t.bins);setText('binsHint',t.binsHint);setText('fullLabel',t.full);setText('fullHint',t.fullHint);setText('impactLabel',t.impact);setText('impactHint',t.impactHint);setText('calendarLabel',t.calendar);setText('calendarHint',t.calendarHint);setText('residentBinsTitle',t.residentBins);setText('reportsTitle',t.reports);setText('reportsHint',t.reportsHint);setText('sortTitle',t.sort);setText('residentsLabel',t.residents);setText('residentsHint',t.residentsHint);setText('adminBinsLabel',t.adminBins);setText('adminCasesLabel',t.adminCases);setText('adminWeightLabel',t.adminWeight);setText('dailyTitle',t.daily);setText('dailyHint',t.dailyHint);setText('materialsTitle',t.materials);setText('materialsHint',t.materialsHint);setText('operationsTitle',t.operations);$('language').textContent=lang==='kaa'?'ҚҚ · RU':'RU · ҚҚ'}
      function drawResident(){const t=copy[lang];setText('welcome',(t.hello)+(summary.name?' · '+summary.name:''));setText('binsValue',summary.bins);setText('fullValue',summary.fullBins);setText('impactValue',Number(summary.acceptedKg||0).toFixed(1)+' kg');setText('calendarValue',formatSchedule(summary.schedule)||'—');if(!summary.registered)setText('subhead',t.notRegistered);setText('openBot',summary.registered?t.open:t.openBot);const bins=summary.residentBins||[];$('residentBins').innerHTML=bins.length?bins.map(b=>`<div class="report-row"><span>${esc(materialLabel(b.material))}<br><small>${esc(b.address||'')}</small></span><span class="pill">${esc(binStatus(b.status))}</span></div>`).join(''):`<div class="empty">${esc(t.notRegistered)}</div>`;const reportItems=summary.reports||[];$('reports').innerHTML=reportItems.length?reportItems.map(r=>`<div class="report-row"><span>${r.kind==='dump'?'🗑':'⚠️'} <b>${esc(r.kind==='dump'?t.dump:t.pickup)} #${r.id}</b><br><small>${esc(r.address||r.description||'')}</small></span><span class="pill">${esc(reportStatus(r.status))}</span></div>`).join(''):`<div class="empty">${esc(t.noReports)}</div>`;const sort=[['🧴',t.plastic,t.plasticTip],['📄',t.paper,t.paperTip],['🍾',t.glass,t.glassTip]];$('sorting').innerHTML=sort.map(x=>`<div class="report-row"><span>${x[0]} <b>${esc(x[1])}</b><br><small>${esc(x[2])}</small></span><span class="pill">EcoMap</span></div>`).join('');$('openBot').onclick=()=>tg?.openTelegramLink('https://t.me/Bin4Home_bot')}
      function binStatus(s){if(s==='Нужна уборка')return copy[lang].fullBin;if(s==='Пустая')return copy[lang].emptyBin;return s}
      function reportStatus(s){if(s==='resolved')return copy[lang].resolvedStatus;if(s==='new')return copy[lang].newStatus;return s}
      function formatSchedule(raw){if(!raw)return '';const days={mon:lang==='kaa'?'Dúyshembi':'Пн',tue:lang==='kaa'?'Siyshembi':'Вт',wed:lang==='kaa'?'Sárshembi':'Ср',thu:lang==='kaa'?'Piyshembi':'Чт',fri:lang==='kaa'?'Juma':'Пт',sat:lang==='kaa'?'Shembi':'Сб',sun:lang==='kaa'?'Ekshembi':'Вс'};const mats={plastic:copy[lang].plastic,paper:copy[lang].paper,glass:copy[lang].glass};return raw.split(',').map(pair=>{const [day,mat]=pair.split(':');return `${days[day]||day} · ${mats[mat]||mat}`}).join(' / ')}
      function drawBars(items){const max=Math.max(1,...items.map(x=>Number(x.kg)||0));$('dailyChart').innerHTML=items.length?items.map((x,i)=>`<div class="bar-col"><div class="bar" style="height:${Math.max(5,(Number(x.kg)||0)/max*88)}%;animation-delay:${i*45}ms" title="${Number(x.kg||0).toFixed(1)} kg"></div><span class="bar-label">${esc(x.day)}</span></div>`).join(''):`<div class="empty-chart">${esc(copy[lang].noData)}</div>`}
      function drawDonut(items){const colors=['#176b4a','#bce86e','#e99955','#7bb6a0'];const total=items.reduce((s,x)=>s+Number(x.kg||0),0);let at=0;const slices=items.map((x,i)=>{const from=at;at+=total?Number(x.kg||0)/total*360:0;return `${colors[i%colors.length]} ${from}deg ${at}deg`});$('donut').style.background=total?`conic-gradient(${slices.join(',')})`:'#e8ede0';setText('acceptedTotal',total.toFixed(1));$('legend').innerHTML=items.length?items.map((x,i)=>`<div class="legend-row"><i class="dot" style="background:${colors[i%colors.length]}"></i>${esc(materialLabel(x.material))} · ${Number(x.kg).toFixed(1)} kg</div>`).join(''):`<span class="empty">${esc(copy[lang].noData)}</span>`}
      function materialLabel(m){return ({plastic:copy[lang].plastic,paper:copy[lang].paper,glass:copy[lang].glass,mixed:lang==='kaa'?'Aralas':'Смешанное'})[m]||m}
      function drawAdmin(){const t=copy[lang];setText('headline',t.admin);setText('subhead',t.operations);setText('residentsValue',stats.residents);setText('adminBinsValue',stats.bins);setText('adminCasesValue',Number(stats.openDumpReports)+Number(stats.openPickupIssues));setText('adminWeightValue',Number(stats.collectedKg||0).toFixed(1)+' kg');setText('adminBinsHint',fmt(t.adminBinsHint,{n:stats.fullBins}));setText('adminCasesHint',fmt(t.adminCasesHint,{a:stats.openDumpReports,b:stats.openPickupIssues}));setText('adminWeightHint',fmt(t.adminWeightHint,{n:Number(stats.acceptedKg||0).toFixed(1)}));drawBars(stats.daily||[]);drawDonut(stats.materials||[]);const rows=[[t.allReports,stats.dumpReports],[t.openDumps,stats.openDumpReports],[t.openIssues,stats.openPickupIssues],[t.batches,stats.collectionBatches],[t.schedule,formatSchedule(stats.schedule)||'—'],[t.timezone,stats.timezone||'Asia/Tashkent']];$('operations').innerHTML=rows.map(x=>`<div class="report-row"><span>${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('');setText('updatedAt',t.updated+' · '+new Date(stats.generatedAt).toLocaleString(lang==='kaa'?'kaa-Latn':'ru-RU'))}
      function toast(text){$('toast').textContent=text;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
      async function render(){drawShell();try{summary=await api('/api/miniapp/summary');lang=summary.language||lang;localStorage.setItem('ecomap-lang',lang);drawShell();setText('welcome',copy[lang].hello+(summary.name?' · '+summary.name:''));drawResident();$('resident').classList.toggle('hidden',location.search.includes('page=admin')&&summary.isAdmin);if(location.search.includes('page=admin')){if(!summary.isAdmin)throw new Error('forbidden');stats=await api('/api/miniapp/admin/stats');$('admin').classList.remove('hidden');drawAdmin()}else{$('admin').classList.add('hidden')}}catch(e){$('headline').textContent=e.message==='forbidden'?copy[lang].notAdmin:copy[lang].networkError;$('subhead').textContent='';$('resident').classList.add('hidden');$('admin').classList.add('hidden')}finally{$('loading').classList.add('hidden');$('app').classList.remove('hidden')}}
      $('language').addEventListener('click',async()=>{lang=lang==='kaa'?'ru':'kaa';localStorage.setItem('ecomap-lang',lang);drawShell();if(tg?.initData){try{await api('/api/miniapp/language','POST',{language:lang});toast(copy[lang].langSaved)}catch{}}if(summary)drawResident();if(stats&&location.search.includes('page=admin'))drawAdmin()});
      render();
    })();
  </script>
</body>
</html>
